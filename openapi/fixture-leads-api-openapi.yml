openapi: 3.2.0
info:
  description: 'Fixture''s public v1 CRM API for Accounts, Contacts, Deals, Leads, Activities, Pipelines, Notes, and Tasks. Authenticate with `Authorization: Bearer ...` using either a Fixture API key or a Fixture OAuth access token.'
  title: Fixture Leads API
  version: v1
servers:
- url: https://beta-api.fixture.app
security:
- bearerAuth: []
tags:
- description: Create, read, update, and convert Leads.
  name: Leads
paths:
  /api/v1/leads:
    get:
      deprecated: false
      description: Return a paginated list of Leads. Supports filtering by `status` (new, contacted, qualified, unqualified, converted), `source`, `name`, `email`, `company_name`, `lead_list_id`, and created/updated timestamps. The List filter accepts saved list_ IDs, including archived Lists. Sort supports `created_at` or `-created_at`; pagination uses `limit` and `cursor`. Use `fields` to choose which public Lead fields appear in each record.
      operationId: listLeads
      parameters:
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Maximum number of records to return.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          example: 50
          type: integer
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Opaque cursor returned by the previous page. Omit for the first page.
        in: query
        name: cursor
        required: false
        schema:
          example: eyJ2IjoxLCJzb3J0IjoiLWNyZWF0ZWRfYXQiLCJ2YWx1ZSI6IjIwMjYtMDMtMjJUMTQ6MDA6MDFaIiwiaWQiOiI2NjAxZDYxZC0xMTI5LTQyN2MtODI1NS0wOGI1ZjEyZGRhYjUifQ
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Sort by a supported field. Prefix with `-` for descending order.
        in: query
        name: sort
        required: false
        schema:
          default: -created_at
          example: -created_at
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter Leads to one saved List, including archived Lists.
        in: query
        name: lead_list_id
        required: false
        schema:
          example: list_7B5jXRFuLpTQ3nM4PkGvW2
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter Leads by status.
        in: query
        name: status
        required: false
        schema:
          enum:
          - new
          - contacted
          - qualified
          - unqualified
          - converted
          example: qualified
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter Leads by source.
        in: query
        name: source
        required: false
        schema:
          enum:
          - website
          - referral
          - linkedin
          - cold_outreach
          - event
          - form
          - other
          example: website
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter Leads by a partial, case-insensitive person name match.
        in: query
        name: name
        required: false
        schema:
          example: Taylor
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter by an exact email address.
        in: query
        name: email
        required: false
        schema:
          example: alex@acme.example
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        in: query
        name: linkedin_url
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter Leads by company name.
        in: query
        name: company_name
        required: false
        schema:
          example: Prospect Labs
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records created after this ISO 8601 timestamp.
        in: query
        name: created_after
        required: false
        schema:
          example: '2026-03-01T00:00:00Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records created before this ISO 8601 timestamp.
        in: query
        name: created_before
        required: false
        schema:
          example: '2026-03-31T23:59:59Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records updated after this ISO 8601 timestamp.
        in: query
        name: updated_after
        required: false
        schema:
          example: '2026-03-01T00:00:00Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records updated before this ISO 8601 timestamp.
        in: query
        name: updated_before
        required: false
        schema:
          example: '2026-03-31T23:59:59Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Choose which public fields appear in each list record. Omit or pass a blank value for the default list fields, use `*` alone for every public detail field, or pass comma-separated names.
        in: query
        name: fields
        required: false
        schema:
          example: id,name,created_at
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        in: query
        name: include_archived_custom_fields
        required: false
        schema:
          default: false
          type: boolean
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: URL-encoded JSON with up to 10 Custom Field filters. Each filter uses a definition UUID as `field_id`, an `operator`, and a `value` when required. Get definition IDs from `/api/v1/custom-fields/{record_kind}`. Custom-field sorts are unavailable on these cursor lists.
        in: query
        name: custom_query
        required: false
        schema:
          example: '{"filters":[{"field_id":"a274a4f6-3239-4f1a-b8b5-776b17b3d0ae","operator":"gte","value":"20"}]}'
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - company_name: Prospect Labs
                  created_at: '2026-03-20T12:00:00Z'
                  email: taylor@prospect.example
                  estimated_value: 50000
                  id: lead_4P2jXRFuLpTQ3nM4PkGvW6
                  last_activity_at: '2026-03-24T17:30:00Z'
                  name: Taylor Reed
                  phone: +1-415-555-0199
                  source: website
                  status: qualified
                  title: Head of Revenue
                  updated_at: '2026-03-24T18:05:00Z'
                pagination:
                  has_more: false
                  limit: 50
                  next_cursor: null
              schema:
                $ref: '#/components/schemas/V1LeadListPayload'
          description: Paginated Lead list.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: 'Invalid status: ''unknown''. Allowed: [''new'', ''contacted'', ''qualified'', ''unqualified'', ''converted'']'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid filter or pagination parameter.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: leads:read'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: List not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: The filtered List is unavailable in this Organization.
      security:
      - bearerAuth: []
      summary: List Leads
      tags:
      - Leads
    post:
      deprecated: false
      description: Create a new Lead for an unqualified prospect. Leads are kept separate from Accounts and Contacts until explicitly converted via `POST /api/v1/leads/{lead_id}/convert`. Optional list_ids assigns up to 100 saved Lists in the same transaction. Omitted, null, or empty list_ids adds no memberships. Any invalid or archived target rolls back the Lead and every membership.
      operationId: createLead
      requestBody:
        content:
          application/json:
            example:
              company_name: Prospect Labs
              email: taylor@prospect.example
              estimated_value: 50000
              list_ids:
              - list_7B5jXRFuLpTQ3nM4PkGvW2
              name: Taylor Reed
              source: website
              title: Head of Revenue
            schema:
              $ref: '#/components/schemas/V1CreateLeadRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              example:
                data:
                  city: New York
                  company_employee_count: 85
                  company_industry: Fintech
                  company_name: Prospect Labs
                  company_website: https://prospect.example
                  converted_account_id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  converted_at: '2026-03-24T18:05:00Z'
                  converted_contact_id: contact_6M4jXRFuLpTQ3nM4PkGvW8
                  country: US
                  created_at: '2026-03-20T12:00:00Z'
                  email: taylor@prospect.example
                  estimated_value: 50000
                  id: lead_4P2jXRFuLpTQ3nM4PkGvW6
                  last_activity_at: '2026-03-24T17:30:00Z'
                  linkedin_url: https://www.linkedin.com/in/taylor-reed
                  name: Taylor Reed
                  notes: Requested a demo next week.
                  phone: +1-415-555-0199
                  source: website
                  state: NY
                  status: qualified
                  title: Head of Revenue
                  updated_at: '2026-03-24T18:05:00Z'
              schema:
                $ref: '#/components/schemas/V1LeadDetailResponsePayload'
          description: Lead created.
        '400':
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: email must be a valid email address
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Request validation failed.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: leads:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: List not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: A requested List is unavailable in this Organization. No Lead is created.
        '409':
          content:
            application/json:
              example:
                error:
                  code: conflict
                  message: Restore this List before changing its Leads
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: A requested List is archived. No Lead is created.
      security:
      - bearerAuth: []
      summary: Create a Lead
      tags:
      - Leads
  /api/v1/leads/bulk:
    post:
      deprecated: false
      description: Create 1-25 records with the same fields and permissions as individual creates. Each row commits independently. Results stay in input order. Reuse a stable row key with the same create data to recover a prior creation after a lost response. Keys are scoped to the organization, resource, actor, and history source. Reusing a committed key with different data returns a row conflict. A replay reports the original created ID, even if the record was later updated or deleted. Corrected failed rows can reuse their key. Lead list_ids commits with its row. An invalid target rolls back only that row. Replays do not reapply memberships removed after creation.
      operationId: bulkCreateLeads
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    properties:
                      data:
                        $ref: '#/components/schemas/V1CreateLeadRequest'
                      key:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - key
                    - data
                    type: object
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                created: 1
                data:
                - error: null
                  id: lead_example
                  key: row-1
                  status: created
                failed: 0
                replayed: 0
              schema:
                $ref: '#/components/schemas/BulkCreatePayload'
          description: Per-row results, including partial failures.
        '400':
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Provide between 1 and 25 items
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid batch envelope; no records were created.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Authentication required
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid bearer token.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: leads:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing write scope or role.
        '429':
          content:
            application/json:
              example:
                error:
                  code: rate_limit_exceeded
                  message: Rate limit exceeded
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Request rate limit or sandbox request budget exhausted.
      security:
      - bearerAuth: []
      summary: Bulk create Leads
      tags:
      - Leads
  /api/v1/leads/schema:
    get:
      deprecated: false
      description: Return the JSON Schemas for Lead create and update request bodies and the Organization's active Lead custom fields. Use it before building write payloads. Requires leads:read.
      operationId: describeLeadSchema
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  create:
                    properties:
                      notes:
                        type: string
                    required: []
                    type: object
                  custom_fields:
                  - archived: false
                    conversion_mappings: []
                    default_currency_code: null
                    default_value: null
                    description: Customer relationship tier
                    field_type: short_text
                    id: a274a4f6-3239-4f1a-b8b5-776b17b3d0ae
                    key: customer_tier
                    label: Customer tier
                    layout_position: 0
                    options: []
                    record_kind: lead
                    required: false
                    revision: 1
                    section_id: b36731e8-8ceb-4b57-9690-ed3f92f9164a
                  resource: leads
                  update:
                    properties:
                      status:
                        type: string
                    required: []
                    type: object
              schema:
                $ref: '#/components/schemas/V1RecordSchemaResponsePayload'
          description: Lead write schema.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid cursor
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: leads:read'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
      security:
      - bearerAuth: []
      summary: Describe Lead write fields
      tags:
      - Leads
  /api/v1/leads/{lead_id}:
    delete:
      deprecated: false
      description: Delete a Lead by ID. Leads that have already been converted can still be deleted; the Account, Contact, and Deal produced by conversion are unaffected.
      operationId: deleteLead
      parameters:
      - deprecated: false
        description: Opaque Lead ID with the `lead_` prefix.
        in: path
        name: lead_id
        required: true
        schema:
          example: lead_4P2jXRFuLpTQ3nM4PkGvW6
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                deleted: true
                id: lead_4P2jXRFuLpTQ3nM4PkGvW6
              schema:
                $ref: '#/components/schemas/V1LeadDeletePayload'
          description: Lead deleted.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid Lead ID
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid Lead ID.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: leads:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Lead not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Lead not found.
      security:
      - bearerAuth: []
      summary: Delete a Lead
      tags:
      - Leads
    get:
      deprecated: false
      description: Return a single Lead by its `lead_` ID with full detail fields.
      operationId: getLead
      parameters:
      - deprecated: false
        description: Opaque Lead ID with the `lead_` prefix.
        in: path
        name: lead_id
        required: true
        schema:
          example: lead_4P2jXRFuLpTQ3nM4PkGvW6
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        in: query
        name: include_archived_custom_fields
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  city: New York
                  company_employee_count: 85
                  company_industry: Fintech
                  company_name: Prospect Labs
                  company_website: https://prospect.example
                  converted_account_id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  converted_at: '2026-03-24T18:05:00Z'
                  converted_contact_id: contact_6M4jXRFuLpTQ3nM4PkGvW8
                  country: US
                  created_at: '2026-03-20T12:00:00Z'
                  email: taylor@prospect.example
                  estimated_value: 50000
                  id: lead_4P2jXRFuLpTQ3nM4PkGvW6
                  last_activity_at: '2026-03-24T17:30:00Z'
                  linkedin_url: https://www.linkedin.com/in/taylor-reed
                  name: Taylor Reed
                  notes: Requested a demo next week.
                  phone: +1-415-555-0199
                  source: website
                  state: NY
                  status: qualified
                  title: Head of Revenue
                  updated_at: '2026-03-24T18:05:00Z'
              schema:
                $ref: '#/components/schemas/V1LeadDetailResponsePayload'
          description: Lead detail.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid Lead ID
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid Lead ID.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: leads:read'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Lead not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Lead not found.
      security:
      - bearerAuth: []
      summary: Get a Lead
      tags:
      - Leads
    patch:
      deprecated: false
      description: Partially update a Lead by ID. Setting `status` to `converted` on its own does not create downstream records — use the convert endpoint to produce an Account, Contact, and optional Deal.
      operationId: updateLead
      parameters:
      - deprecated: false
        description: Opaque Lead ID with the `lead_` prefix.
        in: path
        name: lead_id
        required: true
        schema:
          example: lead_4P2jXRFuLpTQ3nM4PkGvW6
          type: string
      requestBody:
        content:
          application/json:
            example:
              estimated_value: 50000
              notes: Requested a demo next week.
              status: qualified
            schema:
              $ref: '#/components/schemas/V1UpdateLeadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  city: New York
                  company_employee_count: 85
                  company_industry: Fintech
                  company_name: Prospect Labs
                  company_website: https://prospect.example
                  converted_account_id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  converted_at: '2026-03-24T18:05:00Z'
                  converted_contact_id: contact_6M4jXRFuLpTQ3nM4PkGvW8
                  country: US
                  created_at: '2026-03-20T12:00:00Z'
                  email: taylor@prospect.example
                  estimated_value: 50000
                  id: lead_4P2jXRFuLpTQ3nM4PkGvW6
                  last_activity_at: '2026-03-24T17:30:00Z'
                  linkedin_url: https://www.linkedin.com/in/taylor-reed
                  name: Taylor Reed
                  notes: Requested a demo next week.
                  phone: +1-415-555-0199
                  source: website
                  state: NY
                  status: qualified
                  title: Head of Revenue
                  updated_at: '2026-03-24T18:05:00Z'
              schema:
                $ref: '#/components/schemas/V1LeadDetailResponsePayload'
          description: Updated Lead.
        '400':
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: 'status must be one of: new, contacted, qualified, unqualified, converted'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid ID or request body.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: leads:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Lead not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Lead not found.
        '409':
          content:
            application/json:
              example:
                error:
                  code: conflict
                  message: A custom field changed after the preview
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: A User field token is missing or stale.
      security:
      - bearerAuth: []
      summary: Update a Lead
      tags:
      - Leads
  /api/v1/leads/{lead_id}/convert:
    post:
      deprecated: false
      description: Convert a Lead into an Account and Contact, and optionally create a Deal in a single step. You can target an existing Account via `existing_account_id` or let Fixture create a new one from the Lead's `company_name`. On success the Lead is marked `converted` and linked to the newly created records. The response includes copied and skipped custom-field mapping outcomes.
      operationId: convertLead
      parameters:
      - deprecated: false
        description: Opaque Lead ID with the `lead_` prefix.
        in: path
        name: lead_id
        required: true
        schema:
          example: lead_4P2jXRFuLpTQ3nM4PkGvW6
          type: string
      requestBody:
        content:
          application/json:
            example:
              create_account: true
              create_deal: true
              deal_name: Prospect Labs expansion
              deal_stage_id: stage_2R7jXRFuLpTQ3nM4PkGvW4
              deal_value: 50000
