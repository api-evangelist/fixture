components:
  schemas:
    CreateCustomFieldRequest:
      description: New typed field. Creation requires the Organization creation gate and a current Owner with the record-kind write scope. A Currency field without default_currency_code receives USD.
      properties:
        default_currency_code:
          oneOf:
          - type: string
          - type: 'null'
        default_value:
          oneOf:
          - type: string
          - type: boolean
          - type: integer
          - type: number
          - items:
              type: string
            type: array
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
        description:
          oneOf:
          - type: string
          - type: 'null'
        field_type:
          $ref: '#/components/schemas/CustomFieldType'
        key:
          type: string
        label:
          type: string
        options:
          items:
            $ref: '#/components/schemas/CustomFieldOptionRequest'
          type: array
        reference_kind:
          oneOf:
          - $ref: '#/components/schemas/CustomFieldRecordKind'
          - type: 'null'
        required:
          default: false
          type: boolean
        section_id:
          oneOf:
          - format: uuid
            type: string
          - type: 'null'
      required:
      - field_type
      - key
      - label
      title: CreateCustomFieldRequest
      type: object
