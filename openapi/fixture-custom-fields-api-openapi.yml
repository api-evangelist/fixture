        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: Forbidden
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Required scope, current Owner role, or creation access is missing.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Custom field not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Field not found in this Organization and record kind.
      security:
      - bearerAuth: []
      summary: Delete a custom field
      tags:
      - Custom Fields
    patch:
      deprecated: false
      description: A current Organization Owner and the record-kind write scope are required. Mapping operations require both Lead and destination write scopes. Change label, required state, or fixed default. Omit unchanged properties; explicit null clears a default. Saved values are not rewritten.
      operationId: updateCustomField
      parameters:
      - deprecated: false
        in: path
        name: record_kind
        required: true
        schema:
          $ref: '#/components/schemas/CustomFieldRecordKind'
      - deprecated: false
        in: path
        name: definition_id
        required: true
        schema:
