    put:
      deprecated: false
      description: A current Organization Owner and the record-kind write scope are required. Mapping operations require both Lead and destination write scopes. record_kind must be lead. Save the current preview's revisions and exact option_pairs. One source may map to one field per destination kind, and a destination accepts one source. Conversion copies once; explicit destination input overrides the copy and populated reused Account values win. Selected values with valid confirmed pairs copy even when other selections cannot. Original Lead values remain unchanged; conversion outcomes report any exclusions.
