openapi: 3.2.0
info:
  description: 'Fixture''s public v1 CRM API for Accounts, Contacts, Deals, Leads, Activities, Pipelines, Notes, and Tasks. Authenticate with `Authorization: Bearer ...` using either a Fixture API key or a Fixture OAuth access token.'
  title: Fixture Accounts API
  version: v1
servers:
- url: https://beta-api.fixture.app
security:
- bearerAuth: []
tags:
- description: Create, read, update, and delete company records.
  name: Accounts
paths:
  /api/v1/accounts:
    get:
      deprecated: false
      description: Return a paginated list of Account summaries for the authenticated organization. Supports filtering by `name`, `industry`, `headquarters_city`, and created/updated timestamps. Sort supports `created_at` or `-created_at`; pagination uses `limit` and `cursor`. Use `fields` to choose which public Account fields appear in each record.
      operationId: listAccounts
      parameters:
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Maximum number of records to return.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          example: 50
          type: integer
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Opaque cursor returned by the previous page. Omit for the first page.
        in: query
        name: cursor
        required: false
        schema:
          example: eyJ2IjoxLCJzb3J0IjoiLWNyZWF0ZWRfYXQiLCJ2YWx1ZSI6IjIwMjYtMDMtMjJUMTQ6MDA6MDFaIiwiaWQiOiI2NjAxZDYxZC0xMTI5LTQyN2MtODI1NS0wOGI1ZjEyZGRhYjUifQ
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Sort by a supported field. Prefix with `-` for descending order.
        in: query
        name: sort
        required: false
        schema:
          default: -created_at
          example: -created_at
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter by a partial, case-insensitive name match.
        in: query
        name: name
        required: false
        schema:
          example: Acme
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter Accounts by industry.
        in: query
        name: industry
        required: false
        schema:
          example: Software
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        in: query
        name: linkedin_url
        required: false
        schema:
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter Accounts by headquarters city.
        in: query
        name: headquarters_city
        required: false
        schema:
          example: San Francisco
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records created after this ISO 8601 timestamp.
        in: query
        name: created_after
        required: false
        schema:
          example: '2026-03-01T00:00:00Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records created before this ISO 8601 timestamp.
        in: query
        name: created_before
        required: false
        schema:
          example: '2026-03-31T23:59:59Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records updated after this ISO 8601 timestamp.
        in: query
        name: updated_after
        required: false
        schema:
          example: '2026-03-01T00:00:00Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records updated before this ISO 8601 timestamp.
        in: query
        name: updated_before
        required: false
        schema:
          example: '2026-03-31T23:59:59Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter by owner relationship. Use `owner:user_...` for owned records or `owner:none` for unowned records.
        in: query
        name: relationship
        required: false
        schema:
          example: owner:user_9T5jXRFuLpTQ3nM4PkGvW2
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Choose which public fields appear in each list record. Omit or pass a blank value for the default list fields, use `*` alone for every public detail field, or pass comma-separated names.
        in: query
        name: fields
        required: false
        schema:
          example: id,name,created_at
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        in: query
        name: include_archived_custom_fields
        required: false
        schema:
          default: false
          type: boolean
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: URL-encoded JSON with up to 10 Custom Field filters. Each filter uses a definition UUID as `field_id`, an `operator`, and a `value` when required. Get definition IDs from `/api/v1/custom-fields/{record_kind}`. Custom-field sorts are unavailable on these cursor lists.
        in: query
        name: custom_query
        required: false
        schema:
          example: '{"filters":[{"field_id":"a274a4f6-3239-4f1a-b8b5-776b17b3d0ae","operator":"gte","value":"20"}]}'
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - created_at: '2026-03-10T09:00:00Z'
                  employee_count: 240
                  estimated_revenue: 125000000
                  headquarters_city: San Francisco
                  headquarters_country: US
                  headquarters_state: CA
                  id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  industry: Software
                  last_activity_at: '2026-03-24T17:30:00Z'
                  linkedin_url: https://www.linkedin.com/company/acme
                  name: Acme Corp
                  relationships:
                    owner:
                      users:
                      - id: user_9T5jXRFuLpTQ3nM4PkGvW2
                  updated_at: '2026-03-22T14:00:01Z'
                  website_url: https://acme.example
                pagination:
                  has_more: false
                  limit: 50
                  next_cursor: null
              schema:
                $ref: '#/components/schemas/V1AccountListPayload'
          description: Paginated Account list.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid cursor
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid filter or pagination parameter.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: accounts:read'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
      security:
      - bearerAuth: []
      summary: List Accounts
      tags:
      - Accounts
    post:
      deprecated: false
      description: Create a new Account (company) record in the authenticated organization. Returns the full Account detail payload including the generated `acc_` ID. Typically followed by creating Contacts or Deals linked to this Account.
      operationId: createAccount
      requestBody:
        content:
          application/json:
            example:
              employee_count: 240
              estimated_revenue: 125000000
              industry: Software
              name: Acme Corp
              relationships:
                owner:
                  propagate_to_open_deals: true
                  set:
                  - user_id: user_9T5jXRFuLpTQ3nM4PkGvW2
              website_url: https://acme.example
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              example:
                data:
                  created_at: '2026-03-10T09:00:00Z'
                  description: Strategic enterprise customer.
                  employee_count: 240
                  estimated_revenue: 125000000
                  headquarters_address: 100 Market Street
                  headquarters_city: San Francisco
                  headquarters_country: US
                  headquarters_postal_code: '94105'
                  headquarters_state: CA
                  id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  industry: Software
                  last_activity_at: '2026-03-24T17:30:00Z'
                  linkedin_url: https://www.linkedin.com/company/acme
                  name: Acme Corp
                  phone: +1-415-555-0100
                  relationships:
                    owner:
                      users:
                      - id: user_9T5jXRFuLpTQ3nM4PkGvW2
                  updated_at: '2026-03-22T14:00:01Z'
                  website_url: https://acme.example
              schema:
                $ref: '#/components/schemas/V1AccountDetailResponsePayload'
          description: Account created.
        '400':
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: name is required
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Request validation failed.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: accounts:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
      security:
      - bearerAuth: []
      summary: Create an Account
      tags:
      - Accounts
  /api/v1/accounts/bulk:
    post:
      deprecated: false
      description: Create 1-25 records with the same fields and permissions as individual creates. Each row commits independently. Results stay in input order. Reuse a stable row key with the same create data to recover a prior creation after a lost response. Keys are scoped to the organization, resource, actor, and history source. Reusing a committed key with different data returns a row conflict. A replay reports the original created ID, even if the record was later updated or deleted. Corrected failed rows can reuse their key.
      operationId: bulkCreateAccounts
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateAccountRequest'
                      key:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - key
                    - data
                    type: object
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                created: 1
                data:
                - error: null
                  id: account_example
                  key: row-1
                  status: created
                failed: 0
                replayed: 0
              schema:
                $ref: '#/components/schemas/BulkCreatePayload'
          description: Per-row results, including partial failures.
        '400':
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Provide between 1 and 25 items
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid batch envelope; no records were created.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Authentication required
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid bearer token.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: accounts:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing write scope or role.
        '429':
          content:
            application/json:
              example:
                error:
                  code: rate_limit_exceeded
                  message: Rate limit exceeded
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Request rate limit or sandbox request budget exhausted.
      security:
      - bearerAuth: []
      summary: Bulk create Accounts
      tags:
      - Accounts
  /api/v1/accounts/schema:
    get:
      deprecated: false
      description: Return the JSON Schemas for Account create and update request bodies and the Organization's active Account custom fields. Use it before building write payloads. Requires accounts:read.
      operationId: describeAccountSchema
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  create:
                    properties:
                      name:
                        type: string
                      notes:
                        type: string
                    required:
                    - name
                    type: object
                  custom_fields:
                  - archived: false
                    conversion_mappings: []
                    default_currency_code: null
                    default_value: null
                    description: Customer relationship tier
                    field_type: short_text
                    id: a274a4f6-3239-4f1a-b8b5-776b17b3d0ae
                    key: customer_tier
                    label: Customer tier
                    layout_position: 0
                    options: []
                    record_kind: account
                    required: false
                    revision: 1
                    section_id: b36731e8-8ceb-4b57-9690-ed3f92f9164a
                  resource: accounts
                  update:
                    properties:
                      industry:
                        type: string
                    required: []
                    type: object
              schema:
                $ref: '#/components/schemas/V1RecordSchemaResponsePayload'
          description: Account write schema.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid cursor
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: accounts:read'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
      security:
      - bearerAuth: []
      summary: Describe Account write fields
      tags:
      - Accounts
  /api/v1/accounts/{account_id}:
    delete:
      deprecated: false
      description: Delete an Account by ID. Linked Contacts and Deals are not cascade-deleted — their `account_id` is cleared so the records remain in the organization.
      operationId: deleteAccount
      parameters:
      - deprecated: false
        description: Opaque Account ID with the `account_` prefix.
        in: path
        name: account_id
        required: true
        schema:
          example: account_7B5jXRFuLpTQ3nM4PkGvW2
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                deleted: true
                id: account_7B5jXRFuLpTQ3nM4PkGvW2
              schema:
                $ref: '#/components/schemas/V1AccountDeletePayload'
          description: Account deleted.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid Account ID
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid Account ID.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: accounts:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Account not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Account not found.
      security:
      - bearerAuth: []
      summary: Delete an Account
      tags:
      - Accounts
    get:
      deprecated: false
      description: Return a single Account by its `acc_` ID with all detail fields.
      operationId: getAccount
      parameters:
      - deprecated: false
        description: Opaque Account ID with the `account_` prefix.
        in: path
        name: account_id
        required: true
        schema:
          example: account_7B5jXRFuLpTQ3nM4PkGvW2
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        in: query
        name: include_archived_custom_fields
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  created_at: '2026-03-10T09:00:00Z'
                  description: Strategic enterprise customer.
                  employee_count: 240
                  estimated_revenue: 125000000
                  headquarters_address: 100 Market Street
                  headquarters_city: San Francisco
                  headquarters_country: US
                  headquarters_postal_code: '94105'
                  headquarters_state: CA
                  id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  industry: Software
                  last_activity_at: '2026-03-24T17:30:00Z'
                  linkedin_url: https://www.linkedin.com/company/acme
                  name: Acme Corp
                  phone: +1-415-555-0100
                  relationships:
                    owner:
                      users:
                      - id: user_9T5jXRFuLpTQ3nM4PkGvW2
                  updated_at: '2026-03-22T14:00:01Z'
                  website_url: https://acme.example
              schema:
                $ref: '#/components/schemas/V1AccountDetailResponsePayload'
          description: Account detail.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid Account ID
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid Account ID.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: accounts:read'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Account not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Account not found.
      security:
      - bearerAuth: []
      summary: Get an Account
      tags:
      - Accounts
    patch:
      deprecated: false
      description: Partially update an Account by ID. Only fields present in the request body are modified; omitted fields are left untouched. Pass `null` to clear nullable fields.
      operationId: updateAccount
      parameters:
      - deprecated: false
        description: Opaque Account ID with the `account_` prefix.
        in: path
        name: account_id
        required: true
        schema:
          example: account_7B5jXRFuLpTQ3nM4PkGvW2
          type: string
      requestBody:
        content:
          application/json:
            example:
              description: Strategic enterprise customer.
              phone: +1-415-555-0100
              relationships:
                owner:
                  propagate_to_open_deals: true
                  set:
                  - user_id: user_9T5jXRFuLpTQ3nM4PkGvW2
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  created_at: '2026-03-10T09:00:00Z'
                  description: Strategic enterprise customer.
                  employee_count: 240
                  estimated_revenue: 125000000
                  headquarters_address: 100 Market Street
                  headquarters_city: San Francisco
                  headquarters_country: US
                  headquarters_postal_code: '94105'
                  headquarters_state: CA
                  id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  industry: Software
                  last_activity_at: '2026-03-24T17:30:00Z'
                  linkedin_url: https://www.linkedin.com/company/acme
                  name: Acme Corp
                  phone: +1-415-555-0100
                  relationships:
                    owner:
                      users:
                      - id: user_9T5jXRFuLpTQ3nM4PkGvW2
                  updated_at: '2026-03-22T14:00:01Z'
                  website_url: https://acme.example
              schema:
                $ref: '#/components/schemas/V1AccountDetailResponsePayload'
          description: Updated Account.
        '400':
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: website_url must be a valid URL
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid ID or request body.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: accounts:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Account not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Account not found.
        '409':
          content:
            application/json:
              example:
                error:
                  code: conflict
                  message: A custom field changed after the preview
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: A User field token is missing or stale.
      security:
      - bearerAuth: []
      summary: Update an Account
      tags:
      - Accounts
components:
  schemas:
    BulkCreatePayload:
      properties:
        created:
          type: integer
        data:
          items:
            $ref: '#/components/schemas/BulkCreateResult'
          type: array
        failed:
          type: integer
        replayed:
          type: integer
      required:
      - created
      - data
      - failed
      - replayed
      title: BulkCreatePayload
      type: object
    CustomFieldCurrencyPayload:
      properties:
        amount:
          type: string
        code:
          type: string
      required:
      - amount
      - code
      title: CustomFieldCurrencyPayload
      type: object
    V1RecordSchemaResponsePayload:
      description: Write schema response envelope.
      properties:
        data:
          $ref: '#/components/schemas/V1RecordSchemaPayload'
      required:
      - data
      title: V1RecordSchemaResponsePayload
      type: object
    V1OwnerRelationshipSetUserPayload:
      description: User assignment entry for an owner relationship update.
      properties:
        user_id:
          description: Opaque `user_` identifier.
          example: user_9T5jXRFuLpTQ3nM4PkGvW2
          type: string
      required:
      - user_id
      type: object
    V1OwnerRelationshipPayload:
      description: Owner relationship state for an Account or Deal.
      properties:
        users:
          description: Current owner Users. This list has zero or one item.
          items:
            $ref: '#/components/schemas/V1OwnerUserPayload'
          type: array
      required:
      - users
      type: object
    V1RelationshipsPayload:
      description: Relationships attached to an Account or Deal.
      properties:
        owner:
          $ref: '#/components/schemas/V1OwnerRelationshipPayload'
      required:
      - owner
      type: object
    BulkCreateError:
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      title: BulkCreateError
      type: object
    V1OwnerRelationshipWritePayload:
      description: Owner relationship update payload.
      properties:
        propagate_to_open_deals:
          default: false
          description: For Account owner updates, also update open child Deals.
          type: boolean
        set:
          description: Set to one User to assign an owner, or an empty list to clear the owner.
          items:
            $ref: '#/components/schemas/V1OwnerRelationshipSetUserPayload'
          maxItems: 1
          type: array
      required:
      - set
      type: object
    CustomFieldOptionPayload:
      properties:
        archived:
          type: boolean
        id:
          type: string
        label:
          type: string
        position:
          type: integer
      required:
      - archived
      - id
      - label
      - position
      title: CustomFieldOptionPayload
      type: object
    UpdateAccountRequest:
      description: Request body for partially updating an Account.
      properties:
        custom_field_tokens:
          oneOf:
          - additionalProperties:
              oneOf:
              - type: integer
              - type: 'null'
            type: object
          - type: 'null'
