openapi: 3.2.0
info:
  description: 'Fixture''s public v1 CRM API for Accounts, Contacts, Deals, Leads, Activities, Pipelines, Notes, and Tasks. Authenticate with `Authorization: Bearer ...` using either a Fixture API key or a Fixture OAuth access token.'
  title: Fixture Deals API
  version: v1
servers:
- url: https://beta-api.fixture.app
security:
- bearerAuth: []
tags:
- description: Create, read, update, and delete Deal records.
  name: Deals
paths:
  /api/v1/deals:
    get:
      deprecated: false
      description: Return a paginated list of Deals. Supports filtering by `pipeline_id`, `pipeline_stage_id`, `account_id`, free-text `search` across Deal names, and created/updated timestamps. Sort supports `created_at` or `-created_at`; pagination uses `limit` and `cursor`.
      operationId: listDeals
      parameters:
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Maximum number of records to return.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          example: 50
          type: integer
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Opaque cursor returned by the previous page. Omit for the first page.
        in: query
        name: cursor
        required: false
        schema:
          example: eyJ2IjoxLCJzb3J0IjoiLWNyZWF0ZWRfYXQiLCJ2YWx1ZSI6IjIwMjYtMDMtMjJUMTQ6MDA6MDFaIiwiaWQiOiI2NjAxZDYxZC0xMTI5LTQyN2MtODI1NS0wOGI1ZjEyZGRhYjUifQ
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Sort by a supported field. Prefix with `-` for descending order.
        in: query
        name: sort
        required: false
        schema:
          default: -created_at
          example: -created_at
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Opaque Pipeline ID with the `pipeline_` prefix.
        in: query
        name: pipeline_id
        required: false
        schema:
          example: pipeline_1S6jXRFuLpTQ3nM4PkGvW3
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Opaque Pipeline stage ID with the `stage_` prefix.
        in: query
        name: pipeline_stage_id
        required: false
        schema:
          example: stage_2R7jXRFuLpTQ3nM4PkGvW4
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Search by Deal name.
        in: query
        name: search
        required: false
        schema:
          example: renewal
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Opaque Account ID with the `account_` prefix.
        in: query
        name: account_id
        required: false
        schema:
          example: account_7B5jXRFuLpTQ3nM4PkGvW2
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Opaque Contact ID with the `contact_` prefix.
        in: query
        name: contact_id
        required: false
        schema:
          example: contact_6M4jXRFuLpTQ3nM4PkGvW8
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records created after this ISO 8601 timestamp.
        in: query
        name: created_after
        required: false
        schema:
          example: '2026-03-01T00:00:00Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records created before this ISO 8601 timestamp.
        in: query
        name: created_before
        required: false
        schema:
          example: '2026-03-31T23:59:59Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records updated after this ISO 8601 timestamp.
        in: query
        name: updated_after
        required: false
        schema:
          example: '2026-03-01T00:00:00Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Return only records updated before this ISO 8601 timestamp.
        in: query
        name: updated_before
        required: false
        schema:
          example: '2026-03-31T23:59:59Z'
          format: date-time
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: Filter by owner relationship. Use `owner:user_...` for owned records or `owner:none` for unowned records.
        in: query
        name: relationship
        required: false
        schema:
          example: owner:user_9T5jXRFuLpTQ3nM4PkGvW2
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        in: query
        name: include_archived_custom_fields
        required: false
        schema:
          default: false
          type: boolean
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        description: URL-encoded JSON with up to 10 Custom Field filters. Each filter uses a definition UUID as `field_id`, an `operator`, and a `value` when required. Get definition IDs from `/api/v1/custom-fields/{record_kind}`. Custom-field sorts are unavailable on these cursor lists.
        in: query
        name: custom_query
        required: false
        schema:
          example: '{"filters":[{"field_id":"a274a4f6-3239-4f1a-b8b5-776b17b3d0ae","operator":"gte","value":"20"}]}'
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - account_id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  created_at: '2026-03-15T10:00:00Z'
                  expected_close_date: '2026-06-30'
                  id: deal_5N2jXRFuLpTQ3nM4PkGvW7
                  last_activity_at: '2026-03-24T17:30:00Z'
                  name: Enterprise renewal
                  pipeline_id: pipeline_1S6jXRFuLpTQ3nM4PkGvW3
                  pipeline_stage_id: stage_2R7jXRFuLpTQ3nM4PkGvW4
                  relationships:
                    owner:
                      users:
                      - id: user_9T5jXRFuLpTQ3nM4PkGvW2
                  stage_name: Qualified
                  stage_type: qualified
                  updated_at: '2026-03-22T14:00:01Z'
                  value: 120000
                pagination:
                  has_more: false
                  limit: 50
                  next_cursor: null
              schema:
                $ref: '#/components/schemas/V1DealListPayload'
          description: Paginated Deal list.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid cursor
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid filter or pagination parameter.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: deals:read'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
      security:
      - bearerAuth: []
      summary: List Deals
      tags:
      - Deals
    post:
      deprecated: false
      description: Create a new Deal linked to an Account and a Pipeline stage. If no `pipeline_id` is provided, the organization's default Pipeline is used; if no `pipeline_stage_id` is provided, the Pipeline's first stage is used.
      operationId: createDeal
      requestBody:
        content:
          application/json:
            example:
              account_id: account_7B5jXRFuLpTQ3nM4PkGvW2
              contact_ids:
              - contact_6M4jXRFuLpTQ3nM4PkGvW8
              expected_close_date: '2026-06-30'
              name: Enterprise renewal
              pipeline_id: pipeline_1S6jXRFuLpTQ3nM4PkGvW3
              pipeline_stage_id: stage_2R7jXRFuLpTQ3nM4PkGvW4
              relationships:
                owner:
                  set:
                  - user_id: user_9T5jXRFuLpTQ3nM4PkGvW2
              value: 120000
            schema:
              $ref: '#/components/schemas/V1CreateDealRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              example:
                data:
                  account_id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  contacts:
                  - email: alex@acme.example
                    id: contact_6M4jXRFuLpTQ3nM4PkGvW8
                    is_primary: true
                    name: Alex Morgan
                  created_at: '2026-03-15T10:00:00Z'
                  expected_close_date: '2026-06-30'
                  id: deal_5N2jXRFuLpTQ3nM4PkGvW7
                  last_activity_at: '2026-03-24T17:30:00Z'
                  name: Enterprise renewal
                  notes: Expansion to two teams.
                  pipeline_id: pipeline_1S6jXRFuLpTQ3nM4PkGvW3
                  pipeline_stage_id: stage_2R7jXRFuLpTQ3nM4PkGvW4
                  relationships:
                    owner:
                      users:
                      - id: user_9T5jXRFuLpTQ3nM4PkGvW2
                  stage_name: Qualified
                  stage_type: qualified
                  updated_at: '2026-03-22T14:00:01Z'
                  value: 120000
              schema:
                $ref: '#/components/schemas/V1DealDetailResponsePayload'
          description: Deal created.
        '400':
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: name is required
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Request validation failed.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: deals:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Account not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Referenced Account, Pipeline, stage, or Contact not found.
      security:
      - bearerAuth: []
      summary: Create a Deal
      tags:
      - Deals
  /api/v1/deals/bulk:
    post:
      deprecated: false
      description: Create 1-25 records with the same fields and permissions as individual creates. Each row commits independently. Results stay in input order. Reuse a stable row key with the same create data to recover a prior creation after a lost response. Keys are scoped to the organization, resource, actor, and history source. Reusing a committed key with different data returns a row conflict. A replay reports the original created ID, even if the record was later updated or deleted. Corrected failed rows can reuse their key.
      operationId: bulkCreateDeals
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    properties:
                      data:
                        $ref: '#/components/schemas/V1CreateDealRequest'
                      key:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - key
                    - data
                    type: object
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                created: 1
                data:
                - error: null
                  id: deal_example
                  key: row-1
                  status: created
                failed: 0
                replayed: 0
              schema:
                $ref: '#/components/schemas/BulkCreatePayload'
          description: Per-row results, including partial failures.
        '400':
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Provide between 1 and 25 items
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid batch envelope; no records were created.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Authentication required
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid bearer token.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: deals:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing write scope or role.
        '429':
          content:
            application/json:
              example:
                error:
                  code: rate_limit_exceeded
                  message: Rate limit exceeded
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Request rate limit or sandbox request budget exhausted.
      security:
      - bearerAuth: []
      summary: Bulk create Deals
      tags:
      - Deals
  /api/v1/deals/schema:
    get:
      deprecated: false
      description: Return the JSON Schemas for Deal create and update request bodies and the Organization's active Deal custom fields. Use it before building write payloads. Requires deals:read.
      operationId: describeDealSchema
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  create:
                    properties:
                      account_id:
                        type: string
                      name:
                        type: string
                      notes:
                        type: string
                    required:
                    - account_id
                    - name
                    type: object
                  custom_fields:
                  - archived: false
                    conversion_mappings: []
                    default_currency_code: null
                    default_value: null
                    description: Customer relationship tier
                    field_type: short_text
                    id: a274a4f6-3239-4f1a-b8b5-776b17b3d0ae
                    key: customer_tier
                    label: Customer tier
                    layout_position: 0
                    options: []
                    record_kind: deal
                    required: false
                    revision: 1
                    section_id: b36731e8-8ceb-4b57-9690-ed3f92f9164a
                  resource: deals
                  update:
                    properties:
                      value:
                        type: string
                    required: []
                    type: object
              schema:
                $ref: '#/components/schemas/V1RecordSchemaResponsePayload'
          description: Deal write schema.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid cursor
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid request.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: deals:read'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
      security:
      - bearerAuth: []
      summary: Describe Deal write fields
      tags:
      - Deals
  /api/v1/deals/{deal_id}:
    delete:
      deprecated: false
      description: Delete a Deal by ID. Associated Contact links are removed, but the underlying Contacts and Account remain.
      operationId: deleteDeal
      parameters:
      - deprecated: false
        description: Opaque Deal ID with the `deal_` prefix.
        in: path
        name: deal_id
        required: true
        schema:
          example: deal_5N2jXRFuLpTQ3nM4PkGvW7
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                deleted: true
                id: deal_5N2jXRFuLpTQ3nM4PkGvW7
              schema:
                $ref: '#/components/schemas/V1DealDeletePayload'
          description: Deal deleted.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid Deal ID
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid Deal ID.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: deals:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Deal not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Deal not found.
      security:
      - bearerAuth: []
      summary: Delete a Deal
      tags:
      - Deals
    get:
      deprecated: false
      description: Return a single Deal by its `deal_` ID with full detail fields, including the Pipeline, current stage, and primary Contact (when set).
      operationId: getDeal
      parameters:
      - deprecated: false
        description: Opaque Deal ID with the `deal_` prefix.
        in: path
        name: deal_id
        required: true
        schema:
          example: deal_5N2jXRFuLpTQ3nM4PkGvW7
          type: string
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        in: query
        name: include_archived_custom_fields
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  account_id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  contacts:
                  - email: alex@acme.example
                    id: contact_6M4jXRFuLpTQ3nM4PkGvW8
                    is_primary: true
                    name: Alex Morgan
                  created_at: '2026-03-15T10:00:00Z'
                  expected_close_date: '2026-06-30'
                  id: deal_5N2jXRFuLpTQ3nM4PkGvW7
                  last_activity_at: '2026-03-24T17:30:00Z'
                  name: Enterprise renewal
                  notes: Expansion to two teams.
                  pipeline_id: pipeline_1S6jXRFuLpTQ3nM4PkGvW3
                  pipeline_stage_id: stage_2R7jXRFuLpTQ3nM4PkGvW4
                  relationships:
                    owner:
                      users:
                      - id: user_9T5jXRFuLpTQ3nM4PkGvW2
                  stage_name: Qualified
                  stage_type: qualified
                  updated_at: '2026-03-22T14:00:01Z'
                  value: 120000
              schema:
                $ref: '#/components/schemas/V1DealDetailResponsePayload'
          description: Deal detail.
        '400':
          content:
            application/json:
              example:
                error:
                  code: invalid_parameter
                  message: Invalid Deal ID
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid Deal ID.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: deals:read'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Deal not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Deal not found.
      security:
      - bearerAuth: []
      summary: Get a Deal
      tags:
      - Deals
    patch:
      deprecated: false
      description: Partially update a Deal by ID. Changing `pipeline_stage_id` must reference a stage in the Deal's current Pipeline; use the Pipelines endpoints to discover valid stage IDs.
      operationId: updateDeal
      parameters:
      - deprecated: false
        description: Opaque Deal ID with the `deal_` prefix.
        in: path
        name: deal_id
        required: true
        schema:
          example: deal_5N2jXRFuLpTQ3nM4PkGvW7
          type: string
      requestBody:
        content:
          application/json:
            example:
              notes: Expanded to two teams.
              pipeline_id: pipeline_1S6jXRFuLpTQ3nM4PkGvW3
              pipeline_stage_id: stage_2R7jXRFuLpTQ3nM4PkGvW4
              relationships:
                owner:
                  set:
                  - user_id: user_9T5jXRFuLpTQ3nM4PkGvW2
              value: 150000
            schema:
              $ref: '#/components/schemas/V1UpdateDealRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  account_id: account_7B5jXRFuLpTQ3nM4PkGvW2
                  contacts:
                  - email: alex@acme.example
                    id: contact_6M4jXRFuLpTQ3nM4PkGvW8
                    is_primary: true
                    name: Alex Morgan
                  created_at: '2026-03-15T10:00:00Z'
                  expected_close_date: '2026-06-30'
                  id: deal_5N2jXRFuLpTQ3nM4PkGvW7
                  last_activity_at: '2026-03-24T17:30:00Z'
                  name: Enterprise renewal
                  notes: Expansion to two teams.
                  pipeline_id: pipeline_1S6jXRFuLpTQ3nM4PkGvW3
                  pipeline_stage_id: stage_2R7jXRFuLpTQ3nM4PkGvW4
                  relationships:
                    owner:
                      users:
                      - id: user_9T5jXRFuLpTQ3nM4PkGvW2
                  stage_name: Qualified
                  stage_type: qualified
                  updated_at: '2026-03-22T14:00:01Z'
                  value: 120000
              schema:
                $ref: '#/components/schemas/V1DealDetailResponsePayload'
          description: Updated Deal.
        '400':
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: expected_close_date must be an ISO 8601 date
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Invalid ID or request body.
        '401':
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Missing or invalid API key.
        '403':
          content:
            application/json:
              example:
                error:
                  code: forbidden
                  message: 'Missing required scope: deals:write'
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: API key is missing the required scope.
        '404':
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Deal not found
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: Deal or referenced Pipeline stage not found.
        '409':
          content:
            application/json:
              example:
                error:
                  code: conflict
                  message: A custom field changed after the preview
              schema:
                $ref: '#/components/schemas/V1ErrorResponse'
          description: A User field token is missing or stale.
      security:
      - bearerAuth: []
      summary: Update a Deal
      tags:
      - Deals
  /api/v1/deals/{deal_id}/contacts:
    get:
      deprecated: false
      description: Return the set of Contacts currently associated with a Deal, along with which Contact is marked primary. Use `PUT /api/v1/deals/{deal_id}/contacts` to change the set.
      operationId: listDealContacts
      parameters:
      - deprecated: false
        description: Opaque Deal ID with the `deal_` prefix.
        in: path
        name: deal_id
        required: true
        schema:
          example: deal_5N2jXRFuLpTQ3nM4PkGvW7
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                - contact:
                    email: alex@acme.example
                    id: contact_6M4jXRFuLpTQ3nM4PkGvW8
                    name: Alex Morgan
                  contact_id: contact_6M4jXRFuLpTQ3nM4PkGvW8
                  is_primary: true
              schema:
                $ref: '#/components/schemas/V1DealContactAssociationsResponsePayload'
