aid: fixture
name: Fixture
description: Fixture is an AI-native CRM built for startups, backed by Y Combinator (Winter
  2026 batch). Fixture aggregates every customer interaction — email, calendar, Slack and
  Slack Connect, meeting notes from Granola, Notion and Circleback, and Stripe billing events
  — into a single structured activity graph across Accounts, Contacts, Deals, Leads, Tasks
  and Notes, then uses agents to surface next actions and keep records current without manual
  data entry. The whole system is programmable — Fixture publishes a documented REST v1 API
  with a generated OpenAPI 3.1 description, a hosted remote MCP server with OAuth 2.1 and
  dynamic client registration, and a first-party agent-oriented CLI, so humans and agents work
  against the same surface.
